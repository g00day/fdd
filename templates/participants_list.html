{% extends 'base.html' %}

{% block title %}Участники | МедиаАрхив{% endblock %}

{% block content %}
<h2 class="fw-bold mb-4">Зарегистрированные участники</h2>
<div class="list-group shadow-sm bg-white rounded border">
    {% for p in participants %}
        <a href="{% url 'participant_detail' p.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3 border-0 border-bottom">
            <div>
                <h5 class="mb-1 text-dark fw-semibold">{{ p.full_name }}</h5>
                <small class="text-muted">✉️ {{ p.email }}</small>
            </div>
            <span class="badge bg-secondary px-3 py-2 rounded-pill">{{ p.role }}</span>
        </a>
    {% empty %}
        <div class="p-4 text-center text-muted">
            <p class="mb-0">Зарегистрированные участники не найдены.</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
