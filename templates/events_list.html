{% extends 'base.html' %}

{% block title %}Мероприятия | МедиаАрхив{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Архив мероприятий</h2>
</div>
<div class="list-group shadow-sm bg-white rounded border">
    {% for ev in events %}
        <a href="{% url 'event_detail' ev.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3 border-0 border-bottom">
            <div>
                <h5 class="mb-1 text-primary fw-semibold">{{ ev.title }}</h5>
                <small class="text-muted">📍 {{ ev.location }}</small>
            </div>
            <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm">{{ ev.date|date:"Y-m-d" }}</span>
        </a>
    {% empty %}
        <div class="p-4 text-center text-muted">
            <p class="mb-0">Мероприятия в медиаархиве отсутствуют.</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
