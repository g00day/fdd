{% load static %} {# Обязательный тег загрузки статики Django #}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}МедиаАрхив Мероприятий{% endblock %}</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">МедиаАрхив</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'events_list' %}">Мероприятия</a>
                <a class="nav-link" href="{% url 'participants_list' %}">Участники</a>
            </div>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал сайта, использующий скрипт JavaScript для вывода года -->
    <footer class="container text-center text-muted mt-5 py-3 border-top">
        <p>&copy; <span id="current-year"></span> МедиаАрхив Мероприятий</p>
    </footer>

    <!-- Подключение нашего локального JS-файла -->
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
